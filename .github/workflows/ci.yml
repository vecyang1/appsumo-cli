name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true
          cache: true
      - run: go mod verify
      - run: go test ./...
      # The suite spins up httptest servers per test; -race is cheap here and is
      # the only check that sees a data race at all.
      - run: go test -race ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      # Contributors run ./appsumo from the checkout, which passes for reasons a
      # user does not have. This installs and runs it from outside the tree.
      - run: ./scripts/install_smoke.sh
